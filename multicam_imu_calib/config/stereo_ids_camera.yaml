#
# Test file for stereo camera calibration from tag board
#
#
targets:
  - name: "apriltag board"
    type: "apriltag_board"
    detector: "umich"
    family: "tf36h11"
    starting_tag_id: 0
    tag_size: 0.07
    rows: 3
    distance_rows: 0.087
    columns: 4
    distance_columns: 0.087

cameras:
  - name: "camera_0"
    image_topic: "/event_cam_0/camera/events/image"
    pixel_noise: 1.0
    resolution: [1280, 720]
    intrinsics:
      fx: 2450
      fy: 2450
      cx: 640
      cy: 360
    distortion_model:
      type: "radtan"
      coefficients: [0, -0.1, 0, 0]
      coefficient_mask: [1, 1, 1, 1]
      coefficient_sigma: [0.5, 0.5, 0.5, 0.5]
    pose:
      position:
        x: 0.0
        y: 0.0
        z: 0.0
      position_sigma:
        x: 1.e-6
        y: 1.e-6
        z: 1.e-6
      orientation:
        x: 0.0
        y: 0.0
        z: 0.0
        w: 1.0
      orientation_sigma:
        x: 1.e-6
        y: 1.e-6
        z: 1.e-6
  - name: "camera_1"
    image_topic: "/event_cam_1/camera/events/image"
    pixel_noise: 1.0
    intrinsics:
      fx: 2450
      fy: 2450
      cx: 640
      cy: 360
    resolution: [1280, 720]
    distortion_model:
      type: "radtan"
      coefficients: [0, -0.1, 0, 0]
      coefficient_mask: [1, 1, 1, 1]
      coefficient_sigma: [0.5, 0.5, 0.5, 0.5]
    pose:
      position:
        x: 0.18783
        y: -0.00016056
        z: 0.0073778
      position_sigma:
        x: 0.05
        y: 0.05
        z: 0.05
      orientation:
        x: -0.007519686
        y: -0.0024889645
        z: -0.0013709476
        w: 0.99996769
      orientation_sigma:
        x: 0.1
        y: 0.1
        z: 0.1
